[package]
authors = ["Jake O'Shannessy <joshannessy@smokecloud.com>"]
edition = "2021"
name = "fdspp"
version = "0.3.2"
license = "GPL-2.0-or-later"

[workspace]
members = [".", "wasm"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tempfile", "dep:serde_json"]

[[bin]]
name = "fdspp"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["cargo"], optional = true }
namelist = "0.3"
tempfile = { version = "3.7.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

# Minimise the size of the wasm build
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
